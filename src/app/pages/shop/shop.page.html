<section class="shop wrap">
  <aside class="filters">
    <h2>Category</h2>
    <a routerLink="/shop" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">All</a>
    @for (cat of catalog.allCategories(); track cat.id) {
      <a [routerLink]="['/shop', cat.slug]" routerLinkActive="active">{{ cat.name }}</a>
    }
  </aside>

  <div class="pane">
    <div class="toolbar">
      <div>
        <h1>{{ title() }}</h1>
        <p>{{ products().length }} products</p>
      </div>
      <label>
        Sort
        <select [ngModel]="sort()" (ngModelChange)="sort.set($event)">
          <option value="default">Relevance</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name">Name</option>
        </select>
      </label>
    </div>

    @if (products().length === 0) {
      <p class="empty">No products in this category yet.</p>
    } @else {
      <div class="product-grid">
        @for (product of products(); track product.id) {
          <app-product-card [product]="product" />
        }
      </div>
    }
  </div>
</section>
