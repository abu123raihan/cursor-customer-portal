<section class="wrap page">
  <header>
    <p class="eyebrow">Saved for later</p>
    <h1>Wishlist</h1>
  </header>

  @if (products().length === 0) {
    <div class="empty">
      <mat-icon>favorite_border</mat-icon>
      <h2>No saved items yet</h2>
      <a mat-flat-button color="primary" routerLink="/shop">Browse products</a>
    </div>
  } @else {
    <div class="grid">
      @for (product of products(); track product.id) {
        <article>
          <a [routerLink]="['/product', product.slug]">
            <img [src]="product.image" [alt]="product.name" />
          </a>
          <div>
            <a [routerLink]="['/product', product.slug]">{{ product.name }}</a>
            <p>{{ product.price | currency: product.currency : "symbol" : "1.0-0" }}</p>
            <div class="actions">
              <button mat-flat-button color="primary" type="button" (click)="moveToCart(product.id)">
                Move to cart
              </button>
              <button mat-button type="button" (click)="remove(product.id)">Remove</button>
            </div>
          </div>
        </article>
      }
    </div>
  }
</section>
